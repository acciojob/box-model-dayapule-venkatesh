<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<style>
		.container{
			display:grid;
			grid-template-columns:1fr 1fr 1fr;
			grid-template-rows:1fr;
			border: 2px solid;
			background-color:gray;
			padding:10px;
			width:200px;
			border-radius:15px;
			gap:10px
		}
		.red{
			background-color:red;
		
			height:60px;
			width:60px;
			border-radius:50%;	
			
		}
		.green{
			background-color:green;
			
			height:60px;
			width:60px;
			border-radius:50%;	
			
		}
		.yellow{
			background-color:yellow;
			
			height:60px;
			width:60px;
			border-radius:50%;		
			
		}
	</style>
</head>

<body>
	<!-- the entire body must be written by student -->

	<div class="container">
		<div class="green"></div>
		<div class="yellow"></div>
		<div class="red"></div>
		
	</div>
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
